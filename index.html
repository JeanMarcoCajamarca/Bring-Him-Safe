<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset="utf-8">
    <title>Bring Him Safe</title>
    <link rel="stylesheet" href="game.css">
</head>
<body>
<!-- game content is here baby!!!  -->
<header>
    <div class="row">
        <h1>Bring Him Safe</h1>
    </div>
</header>
<section id="game">
    <div id="game-scene" class="scene out">
        <div id="stage">Stage 1</div>
        <div id='quest' class="quest">
            <div id="quest-composition"
            class="composition"></div>
        </div>
    </div>

    <div id='element-template'>
        <!-- for composition view-->
        <div class="pattern" data-pattern='1'></div>
    </div>
        <a href="#" id="finish-btn">Finish</a>
    </div>
    <div id="start-scene" class="scene">
        <a href="#" id="start-btn" class="button">Start Game</a>
    </div>
    <div id="summary-scene" class="scene out">
        <a href="#" id="next-level-button"
        class="button">Next</a>
    </div>
    <div id="gameover-scene" class="scene out">
        <a href="#" id="back-to-menu-button" 
        class="button">Back to menu</a>
    </div>
</section>
<section class='how-to-play'>
    <div class="row">
        <h2>How to Play?</h2>
        <p>Use the arrow keys on your keyboard to move character.</p>
    </div>
</section>
<footer>
    <div class="row">
        <p>This game is made possible by the bro himself, Jack Karusel.</p>
        <p>No generative AI was used for the development of this game.</p>
    </div>
</footer>
<div id='element-template'>
</div>
    <script src='js/patch.js'></script>
    <script src='js/composition.js'></script>
    <script src='js/quest.js'></script>
    <script src='js/scenes.js'></script> 
    <script src='js/game.js'></script>
</body>
</html>
